# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "SecretarIA"
  integrantes:          
    - nome: "Daniely Maximo Marcon"
      rga: "202519060120"
    - nome: "Giovanna Camila de Oliveira Teodoro"
      rga: "202519060350"
    - nome: "Mamadu Mutaro Ba"
      rga: "202519060830"
    - nome: "Rodnilson Barai"
      rga: "202519060589"

tema:
  nome: "Secretaria Acadêmica"
  descricao: >
   O chatbot responde sobre assuntos relevantes da secretaria acadêmica como: períodoo de matricula e rematricula, onde encontrar histórico, declarações, como trancar o curso, o que é aproveitamento de disciplinas e o que impede a colação de grau.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
   Você é o SecrêBot, assistente virtual do
   Secretaria Academica. Seja cordial, simples e direto.
  contato: "secac.facom@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  matricula:
    descricao: "período de matrícula na faculdade."
    resposta: >
     O período de matrícula é definido pelo calendário acadêmico da ufms.
  rematricula:
    descricao: "período de renovação de vínculo com a faculdade."
    resposta: >
      O período de rematrícula é definido pelo calendário acadêmico da ufms.
  trancamento:
    descricao: "onde realizar trancamento de matrícula"
    resposta: >
      O trancamento de matrícula pode ser feito por meio do siscad na área de trancamento de matrícula.
  historico:
    descricao: "onde encontrar histórico acadêmico."
    resposta: >
      O histórico acadêmico pode ser encontrado no siscad.
  declaracao:
    descricao: "onde encontrar declarações acadêmicas."
    resposta: >
      As declarações acadêmicas podem ser encontrado no siscad na área rotulada como "Meus Documentos".
  aproveitamento:
    descricao: "informar sobre como funciona o aproveitamento de disciplinas cursadas."
    resposta: >
      O aproveitamento de disciplinas segue regras sobre a carga horaria mínima cursada e a grade da disciplina cursada.
  colacao_grau:
    descricao: "informar sobre impedimentos para colação de grau."
    resposta: >
      Os principais impedimentos para a colação de grau são referentes ao não cumprimento da carga horária, e a não integralização total da estrutura curricular.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
